<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* カスタムスクロールバーなどのスタイル */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #2f3136;
    }
    ::-webkit-scrollbar-thumb {
      background: #202225;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased h-screen flex flex-col select-none overflow-hidden">

  <!-- 認証画面（ログイン / 新規登録） -->
  <div id="auth-container" class="flex-1 flex items-center justify-center bg-gray-900 p-4 z-50">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-md border border-gray-700">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-indigo-400">おかえりなさい！</h2>
        <p class="text-gray-400 text-sm mt-1">Discord Cloneへログインしてください</p>
      </div>
      <div id="auth-error" class="bg-red-500/20 border border-red-500 text-red-200 p-3 rounded mb-4 hidden text-sm"></div>
      
      <div class="space-y-4">
        <div>
          <label class="block text-gray-300 text-xs font-bold uppercase mb-2">ユーザーID名 (user_id_name)</label>
          <input type="text" id="user-id-name" placeholder="例: guest123" class="w-full p-2.5 rounded bg-gray-900 text-white border border-gray-700 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-gray-300 text-xs font-bold uppercase mb-2">表示名 (display_name)</label>
          <input type="text" id="display-name" placeholder="例: ゲストユーザー" class="w-full p-2.5 rounded bg-gray-900 text-white border border-gray-700 focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label class="block text-gray-300 text-xs font-bold uppercase mb-2">パスワード</label>
          <input type="password" id="password" class="w-full p-2.5 rounded bg-gray-900 text-white border border-gray-700 focus:outline-none focus:border-indigo-500">
        </div>
        <div class="flex gap-3 pt-2">
          <button id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 px-4 rounded transition">ログイン</button>
          <button id="btn-signup" class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-2.5 px-4 rounded transition">新規登録</button>
        </div>
      </div>
    </div>
  </div>

  <!-- メインアプリUI -->
  <div id="app-container" class="flex-1 flex overflow-hidden hidden">
    
    <!-- 1. 最左端：サーバーアイコンバー -->
    <div class="w-18 bg-gray-950 flex flex-col items-center py-3 gap-2 border-r border-gray-800 z-10 w-[72px]">
      <!-- DMホームボタン -->
      <button id="btn-home" class="w-12 h-12 rounded-3xl bg-gray-700 hover:bg-indigo-600 hover:rounded-2xl flex items-center justify-center transition-all duration-200 group relative">
        <span class="text-xl">🏠</span>
      </button>
      <div class="w-8 h-[2px] bg-gray-800 rounded"></div>
      
      <!-- サーバーアイコン一覧 (JavaScriptで動的生成) -->
      <div id="server-icons-list" class="flex-1 w-full flex flex-col items-center gap-2 overflow-y-auto"></div>
    </div>

    <!-- 2. サイドバー：ダイレクトメッセージ / サーバーチャンネル パネル -->
    <div class="w-60 bg-gray-800 flex flex-col border-r border-gray-900">
      
      <!-- DMモード時のサイドバーコンテンツ -->
      <div id="sidebar-dm" class="flex-1 flex flex-col overflow-hidden">
        <div class="p-3 border-b border-gray-900 shadow-sm">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">フレンド追加</h3>
          <div class="flex gap-1">
            <input type="text" id="friend-id-input" placeholder="ユーザーID名" class="w-full p-1.5 text-xs rounded bg-gray-900 text-white border border-gray-700 focus:outline-none">
            <button id="btn-add-friend" class="bg-indigo-600 text-xs px-2.5 py-1.5 rounded font-bold hover:bg-indigo-500 transition">追加</button>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto p-2">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-2 my-2">ダイレクトメッセージ</h3>
          <div id="friends-list" class="space-y-0.5"></div>
        </div>
      </div>

      <!-- サーバーモード時のサイドバーコンテンツ -->
      <div id="sidebar-server" class="flex-1 flex flex-col overflow-hidden hidden">
        <div class="p-3 border-b border-gray-900 shadow-sm">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">サーバーを作成</h3>
          <div class="flex gap-1">
            <input type="text" id="new-server-name" placeholder="サーバー名" class="w-full p-1.5 text-xs rounded bg-gray-900 text-white border border-gray-700 focus:outline-none">
            <button id="btn-create-server" class="bg-indigo-600 text-xs px-2.5 py-1.5 rounded font-bold hover:bg-indigo-500 transition">作成</button>
          </div>
        </div>
        <div class="flex-1 overflow-y-auto p-2">
          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider px-2 my-2">テキストチャンネル</h3>
          <div id="channels-list" class="space-y-0.5">
            <div class="p-2 rounded bg-gray-700/50 text-white text-sm flex items-center gap-2 cursor-pointer">
              <span class="text-gray-400">#</span> general
            </div>
          </div>
        </div>
      </div>

      <!-- サイドバー最下部：ログインユーザープロフィールバー -->
      <div class="h-14 bg-gray-900 px-3 flex items-center justify-between border-t border-gray-950">
        <div class="flex items-center gap-2 overflow-hidden">
          <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-sm font-bold flex-shrink-0">
            👤
          </div>
          <div class="overflow-hidden">
            <div id="user-display-name" class="text-sm font-bold truncate">ユーザー名</div>
            <div id="user-id-display" class="text-xs text-gray-400 truncate">@userid</div>
          </div>
        </div>
        <button id="btn-logout" title="ログアウト" class="text-gray-400 hover:text-red-400 p-1 rounded transition text-xs">
          🚪
        </button>
      </div>

    </div>

    <!-- 3. メインチャットエリア -->
    <div class="flex-1 flex flex-col bg-gray-700">
      
      <!-- ヘッダー -->
      <div class="h-12 border-b border-gray-900 flex items-center justify-between px-4 bg-gray-700 shadow-sm">
        <div class="flex items-center gap-2">
          <span class="text-gray-400 text-lg font-bold">#</span>
          <span id="chat-title" class="font-bold text-white">フレンドまたはサーバーを選択してください</span>
        </div>
        
        <!-- 通話ボタン (DM選択時のみ表示) -->
        <div id="call-buttons" class="flex gap-2 hidden">
          <button id="btn-start-audio-call" title="音声通話を開始" class="bg-gray-800 hover:bg-green-600 text-white p-2 rounded-full transition flex items-center justify-center">
            📞
          </button>
          <button id="btn-start-video-call" title="ビデオ通話を開始" class="bg-gray-800 hover:bg-indigo-600 text-white p-2 rounded-full transition flex items-center justify-center">
            📹
          </button>
        </div>
      </div>

      <!-- メッセージ表示領域 -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

      <!-- メッセージ入力フォーム -->
      <div class="p-4 bg-gray-700">
        <form id="message-form" class="flex gap-2">
          <input type="text" id="message-input" placeholder="メッセージを入力..." class="flex-1 p-3 rounded-lg bg-gray-600 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 border-none" disabled>
          <button type="submit" id="btn-send-message" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-3 rounded-lg font-bold transition disabled:opacity-50" disabled>送信</button>
        </form>
      </div>

    </div>

  </div>

  <!-- WebRTC 通話モーダル -->
  <div id="call-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
    <div class="bg-gray-800 p-6 rounded-2xl max-w-lg w-full flex flex-col items-center border border-gray-700 shadow-2xl">
      <h3 id="call-status-title" class="text-xl font-bold mb-4 text-center text-white">通話中...</h3>
      
      <div class="relative w-full aspect-video bg-gray-950 rounded-xl overflow-hidden mb-6 flex items-center justify-center border border-gray-800">
        <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
        <video id="local-video" autoplay playsinline muted class="absolute bottom-3 right-3 w-32 aspect-video bg-gray-900 rounded-lg border border-gray-700 object-cover shadow-lg"></video>
      </div>

      <div id="active-call-controls" class="flex gap-4">
        <button id="btn-end-call" class="bg-red-600 hover:bg-red-700 text-white px-8 py-2.5 rounded-full font-bold shadow-lg transition">切断</button>
      </div>
      <div id="incoming-call-controls" class="flex gap-4 hidden">
        <button id="btn-accept-call" class="bg-green-600 hover:bg-green-700 text-white px-8 py-2.5 rounded-full font-bold shadow-lg transition">応答</button>
        <button id="btn-reject-call" class="bg-red-600 hover:bg-red-700 text-white px-8 py-2.5 rounded-full font-bold shadow-lg transition">拒否</button>
      </div>
    </div>
  </div>

  <!-- メインスクリプト -->
  <script>
    // Supabase 設定
    const SUPABASE_URL = 'https://aaedzwnhwfhoyncunarl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZWR6d25od2Zob3luY3VuYXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTgwOTUsImV4cCI6MjEwNTQ3NDA5NX0.7trNhAI5OAJ0coOt4bNx-NAg5zhYvAWgG7QRoM6friI';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // グローバル状態
    let currentUser = null;
    let currentMode = 'dm'; // 'dm' または 'server'
    let currentTargetFriendId = null;
    let currentServerId = null;

    // WebRTC 状態
    let localStream = null;
    let peerConnection = null;
    let callChannel = null;
    let incomingSignalData = null;

    const rtcConfiguration = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // DOM 要素
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const authError = document.getElementById('auth-error');
    const userDisplayName = document.getElementById('user-display-name');
    const userIdDisplay = document.getElementById('user-id-display');
    const friendsList = document.getElementById('friends-list');
    const serverIconsList = document.getElementById('server-icons-list');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const btnSendMessage = document.getElementById('btn-send-message');
    const chatTitle = document.getElementById('chat-title');
    const callButtons = document.getElementById('call-buttons');

    // 認証処理 (profiles テーブル参照)
    document.getElementById('btn-signup').onclick = async () => {
      const userIdName = document.getElementById('user-id-name').value.trim();
      const displayName = document.getElementById('display-name').value.trim() || userIdName;
      const password = document.getElementById('password').value;
      
      if (!userIdName || !password) return showError('ユーザーID名とパスワードを入力してください');

      const { data, error } = await supabaseClient.from('profiles').insert([{ 
        user_id_name: userIdName, 
        display_name: displayName,
        password: password 
      }]).select().single();
      
      if (error) return showError('新規登録エラー: ' + error.message);

      currentUser = data;
      localStorage.setItem('discord_user', JSON.stringify(currentUser));
      initApp();
    };

    document.getElementById('btn-login').onclick = async () => {
      const userIdName = document.getElementById('user-id-name').value.trim();
      const password = document.getElementById('password').value;
      if (!userIdName || !password) return showError('ユーザーID名とパスワードを入力してください');

      const { data, error } = await supabaseClient.from('profiles').select('*').eq('user_id_name', userIdName).eq('password', password).single();
      if (error || !data) return showError('ログイン失敗: ユーザーID名かパスワードが違います');

      currentUser = data;
      localStorage.setItem('discord_user', JSON.stringify(currentUser));
      initApp();
    };

    document.getElementById('btn-logout').onclick = () => {
      localStorage.removeItem('discord_user');
      location.reload();
    };

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    // アプリ初期化
    function initApp() {
      authContainer.classList.add('hidden');
      appContainer.classList.remove('hidden');
      userDisplayName.textContent = currentUser.display_name;
      userIdDisplay.textContent = `@${currentUser.user_id_name}`;

      loadFriends();
      loadServersList();
      setupRealtime();
    }

    // 自動ログイン復元
    const savedUser = localStorage.getItem('discord_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      initApp();
    }

    // モード切り替え（DMホームアイコンクリック）
    document.getElementById('btn-home').onclick = () => {
      currentMode = 'dm';
      currentServerId = null;
      document.getElementById('sidebar-dm').classList.remove('hidden');
      document.getElementById('sidebar-server').classList.add('hidden');
      chatTitle.textContent = 'フレンドを選択してください';
      callButtons.classList.add('hidden');
      messageInput.disabled = true;
      btnSendMessage.disabled = true;
      messagesContainer.innerHTML = '';
    };

    // フレンド追加 (friendships テーブルを参照)
    document.getElementById('btn-add-friend').onclick = async () => {
      const friendIdInput = document.getElementById('friend-id-input').value.trim();
      if (!friendIdInput) return;

      const { data: targetUser, error } = await supabaseClient.from('profiles').select('*').eq('user_id_name', friendIdInput).single();
      if (error || !targetUser) return alert('ユーザーが見つかりません');
      if (targetUser.id === currentUser.id) return alert('自分自身をフレンド追加することはできません');

      await supabaseClient.from('friendships').insert([
        { user_id: currentUser.id, friend_id: targetUser.id },
        { user_id: targetUser.id, friend_id: currentUser.id }
      ]);

      document.getElementById('friend-id-input').value = '';
      loadFriends();
    };

    async function loadFriends() {
      const { data, error } = await supabaseClient.from('friendships').select('friend_id, profiles!friendships_friend_id_fkey(id, display_name, user_id_name)').eq('user_id', currentUser.id);
      friendsList.innerHTML = '';
      if (error || !data) return;

      data.forEach(item => {
        const friend = item.profiles;
        if (!friend) return;
        const div = document.createElement('div');
        div.className = 'p-2 rounded hover:bg-gray-700/60 cursor-pointer flex items-center justify-between text-sm transition';
        div.innerHTML = `<span class="font-medium text-gray-200">👤 ${friend.display_name}</span><span class="text-xs text-gray-400">@${friend.user_id_name}</span>`;
        div.onclick = () => selectFriend(friend);
        friendsList.appendChild(div);
      });
    }

    function selectFriend(friend) {
      currentTargetFriendId = friend.id;
      currentServerId = null;
      chatTitle.textContent = `${friend.display_name} (@${friend.user_id_name})`;
      callButtons.classList.remove('hidden');
      messageInput.disabled = false;
      btnSendMessage.disabled = false;
      loadMessages();
    }

    // サーバー作成＆リスト表示
    document.getElementById('btn-create-server').onclick = () => {
      const serverName = document.getElementById('new-server-name').value.trim();
      if (!serverName) return;

      const servers = JSON.parse(localStorage.getItem('my_servers') || '[]');
      const newServer = { id: 'server_' + Date.now(), name: serverName };
      servers.push(newServer);
      localStorage.setItem('my_servers', JSON.stringify(servers));

      document.getElementById('new-server-name').value = '';
      loadServersList();
    };

    function loadServersList() {
      const servers = JSON.parse(localStorage.getItem('my_servers') || '[]');
      serverIconsList.innerHTML = '';

      servers.forEach(srv => {
        const btn = document.createElement('button');
        btn.className = 'w-12 h-12 rounded-3xl bg-gray-700 hover:bg-indigo-600 hover:rounded-2xl flex items-center justify-center transition-all duration-200 text-sm font-bold';
        btn.textContent = srv.name.substring(0, 2);
        btn.title = srv.name;
        btn.onclick = () => selectServer(srv);
        serverIconsList.appendChild(btn);
      });
    }

    function selectServer(server) {
      currentMode = 'server';
      currentServerId = server.id;
      currentTargetFriendId = null;

      document.getElementById('sidebar-dm').classList.add('hidden');
      document.getElementById('sidebar-server').classList.remove('hidden');

      chatTitle.textContent = `サーバー: ${server.name} (# general)`;
      callButtons.classList.add('hidden');
      messageInput.disabled = false;
      btnSendMessage.disabled = false;
      loadMessages();
    }

    // メッセージ送信・読み込み
    document.getElementById('message-form').onsubmit = async (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content) return;

      if (currentMode === 'dm') {
        await supabaseClient.from('messages').insert([{
          sender_id: currentUser.id,
          receiver_id: currentTargetFriendId,
          content: content
        }]);
      } else {
        const localMsgs = JSON.parse(localStorage.getItem(`msgs_${currentServerId}`) || '[]');
        localMsgs.push({
          sender_name: currentUser.display_name,
          content: content,
          created_at: new Date().toLocaleTimeString()
        });
        localStorage.setItem(`msgs_${currentServerId}`, JSON.stringify(localMsgs));
      }

      messageInput.value = '';
      loadMessages();
    };

    async function loadMessages() {
      messagesContainer.innerHTML = '';

      if (currentMode === 'dm') {
        if (!currentTargetFriendId) return;
        const { data, error } = await supabaseClient.from('messages').select('*, profiles!messages_sender_id_fkey(display_name)')
          .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentTargetFriendId}),and(sender_id.eq.${currentTargetFriendId},receiver_id.eq.${currentUser.id})`)
          .order('created_at', { ascending: true });

        if (error || !data) return;

        data.forEach(msg => {
          renderMessage(msg.profiles ? msg.profiles.display_name : '不明', msg.content, new Date(msg.created_at).toLocaleTimeString());
        });
      } else {
        if (!currentServerId) return;
        const localMsgs = JSON.parse(localStorage.getItem(`msgs_${currentServerId}`) || '[]');
        localMsgs.forEach(msg => {
          renderMessage(msg.sender_name, msg.content, msg.created_at);
        });
      }

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function renderMessage(sender, text, time) {
      const div = document.createElement('div');
      div.className = 'flex flex-col';
      div.innerHTML = `
        <div class="flex items-baseline gap-2">
          <span class="font-bold text-indigo-400 text-sm">${sender}</span>
          <span class="text-[10px] text-gray-400">${time}</span>
        </div>
        <div class="text-gray-200 mt-1 bg-gray-800/80 p-2.5 rounded-lg inline-block max-w-xl self-start border border-gray-700/50">${text}</div>
      `;
      messagesContainer.appendChild(div);
    }

    // WebRTC ＆ Supabase Realtime (通話)
    document.getElementById('btn-start-audio-call').onclick = () => startCall(false);
    document.getElementById('btn-start-video-call').onclick = () => startCall(true);

    function setupRealtime() {
      // リアルタイムメッセージ受信
      supabaseClient.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          if (currentMode === 'dm') loadMessages();
        })
        .subscribe();

      // 通話用 Broadcast
      callChannel = supabaseClient.channel('call_signaling');

      callChannel
        .on('broadcast', { event: 'call-signal' }, async ({ payload }) => {
          if (payload.targetId !== currentUser.id) return;

          if (payload.type === 'offer') {
            incomingSignalData = payload;
            openCallModal(`${payload.senderName} から着信中...`, payload.isVideo);
            document.getElementById('active-call-controls').classList.add('hidden');
            document.getElementById('incoming-call-controls').classList.remove('hidden');
          } 
          else if (payload.type === 'answer') {
            document.getElementById('call-status-title').textContent = '通話中';
            if (peerConnection) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
            }
          } 
          else if (payload.type === 'candidate') {
            if (peerConnection && payload.candidate) {
              await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
          } 
          else if (payload.type === 'end') {
            closeCall();
          }
        })
        .subscribe();
    }

    async function startCall(isVideo) {
      if (!currentTargetFriendId) return alert('相手を選択してください');

      openCallModal('呼び出し中...', isVideo);
      document.getElementById('active-call-controls').classList.add('hidden');
      document.getElementById('incoming-call-controls').classList.add('hidden');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = createPeerConnection(currentTargetFriendId);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        await callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'offer',
            senderId: currentUser.id,
            senderName: currentUser.display_name,
            targetId: currentTargetFriendId,
            sdp: offer,
            isVideo: isVideo
          }
        });

        document.getElementById('active-call-controls').classList.remove('hidden');
      } catch (err) {
        alert('通話の開始に失敗しました: ' + err.message);
        closeCall();
      }
    }

    document.getElementById('btn-accept-call').onclick = async () => {
      if (!incomingSignalData) return;

      document.getElementById('incoming-call-controls').classList.add('hidden');
      document.getElementById('active-call-controls').classList.remove('hidden');
      document.getElementById('call-status-title').textContent = '接続中...';

      const isVideo = incomingSignalData.isVideo;
      const targetId = incomingSignalData.senderId;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = createPeerConnection(targetId);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingSignalData.sdp));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'answer',
            senderId: currentUser.id,
            targetId: targetId,
            sdp: answer
          }
        });

        document.getElementById('call-status-title').textContent = '通話中';
      } catch (err) {
        alert('通話の応答に失敗しました: ' + err.message);
        closeCall();
      }
    };

    document.getElementById('btn-reject-call').onclick = () => {
      if (incomingSignalData && callChannel) {
        callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { type: 'end', senderId: currentUser.id, targetId: incomingSignalData.senderId }
        });
      }
      closeCall();
    };

    document.getElementById('btn-end-call').onclick = () => {
      if (currentTargetFriendId && callChannel) {
        callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { type: 'end', senderId: currentUser.id, targetId: currentTargetFriendId }
        });
      }
      closeCall();
    };

    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(rtcConfiguration);

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          callChannel.send({
            type: 'broadcast',
            event: 'call-signal',
            payload: {
              type: 'candidate',
              senderId: currentUser.id,
              targetId: targetId,
              candidate: event.candidate
            }
          });
        }
      };

      pc.ontrack = (event) => {
        const remoteVideo = document.getElementById('remote-video');
        if (remoteVideo.srcObject !== event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        }
      };

      return pc;
    }

    function openCallModal(statusText, isVideo) {
      document.getElementById('call-status-title').textContent = statusText;
      document.getElementById('call-modal').classList.remove('hidden');
    }

    function closeCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('local-video').srcObject = null;
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('call-modal').classList.add('hidden');
      incomingSignalData = null;
    }
  </script>
</body>
</html>
