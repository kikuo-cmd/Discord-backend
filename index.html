<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- iPad用デバッグコンソール (eruda) -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
</head>
<body class="bg-gray-800 text-white font-sans antialiased h-screen flex flex-col">

  <!-- ログイン・新規登録画面 -->
  <div id="auth-container" class="flex-1 flex items-center justify-center bg-gray-900 p-4">
    <div class="bg-gray-800 p-8 rounded-lg shadow-md w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6 text-center text-indigo-400">Discord Clone</h2>
      <div id="auth-error" class="bg-red-500 text-white p-3 rounded mb-4 hidden text-sm"></div>
      <div class="mb-4">
        <label class="block text-gray-300 text-sm font-bold mb-2">ユーザー名</label>
        <input type="text" id="username" class="w-full p-2.5 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-indigo-500">
      </div>
      <div class="mb-6">
        <label class="block text-gray-300 text-sm font-bold mb-2">パスワード</label>
        <input type="password" id="password" class="w-full p-2.5 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-indigo-500">
      </div>
      <div class="flex gap-4">
        <button id="btn-login" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded transition">ログイン</button>
        <button id="btn-signup" class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded transition">新規登録</button>
      </div>
    </div>
  </div>

  <!-- メインアプリ画面 -->
  <div id="app-container" class="flex-1 flex overflow-hidden hidden">
    <!-- サイドバー -->
    <div class="w-64 bg-gray-900 flex flex-col border-r border-gray-700">
      <div class="p-4 border-b border-gray-800 flex justify-between items-center">
        <div>
          <h1 class="font-bold text-lg text-indigo-400">My Discord</h1>
          <p id="user-display" class="text-xs text-gray-400"></p>
        </div>
        <button id="btn-logout" class="text-xs bg-red-600 hover:bg-red-700 px-2 py-1 rounded">ログアウト</button>
      </div>

      <!-- モード切り替え (DM / サーバー) -->
      <div class="flex border-b border-gray-800 bg-gray-950">
        <button id="tab-dm" class="flex-1 py-2 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500">DM (ダイレクトメッセージ)</button>
        <button id="tab-server" class="flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent">サーバー</button>
      </div>

      <!-- リストエリア -->
      <div class="flex-1 overflow-y-auto p-3 space-y-4">
        <!-- DM セクション -->
        <div id="section-dm">
          <div class="mb-4">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">フレンド追加</h3>
            <div class="flex gap-1">
              <input type="text" id="friend-username" placeholder="ユーザー名" class="w-full p-1.5 text-sm rounded bg-gray-800 text-white border border-gray-700 focus:outline-none">
              <button id="btn-add-friend" class="bg-indigo-600 text-xs px-3 py-1.5 rounded font-bold hover:bg-indigo-700">追加</button>
            </div>
          </div>
          <div>
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">ダイレクトメッセージ</h3>
            <div id="friends-list" class="space-y-1"></div>
          </div>
        </div>

        <!-- サーバー セクション -->
        <div id="section-server" class="hidden">
          <div class="mb-4">
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">サーバーを作成</h3>
            <div class="flex gap-1">
              <input type="text" id="new-server-name" placeholder="サーバー名" class="w-full p-1.5 text-sm rounded bg-gray-800 text-white border border-gray-700 focus:outline-none">
              <button id="btn-create-server" class="bg-indigo-600 text-xs px-3 py-1.5 rounded font-bold hover:bg-indigo-700">作成</button>
            </div>
          </div>
          <div>
            <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">参加中のサーバー</h3>
            <div id="servers-list" class="space-y-1"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- メインコンテンツ (チャット) -->
    <div class="flex-1 flex flex-col bg-gray-800">
      <!-- ヘッダー -->
      <div class="h-14 border-b border-gray-700 flex items-center justify-between px-6 bg-gray-800">
        <div class="flex items-center gap-2">
          <span class="text-gray-400 text-xl">#</span>
          <span id="chat-title" class="font-bold text-lg">フレンドまたはサーバーを選択してください</span>
        </div>
        <!-- 通話ボタン (DM選択時のみ表示) -->
        <div id="call-buttons" class="flex gap-2 hidden">
          <button id="btn-start-audio-call" class="bg-green-600 hover:bg-green-700 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1">
            📞 音声通話
          </button>
          <button id="btn-start-video-call" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-3 py-1.5 rounded flex items-center gap-1">
            📹 ビデオ通話
          </button>
        </div>
      </div>

      <!-- メッセージリスト -->
      <div id="messages-container" class="flex-1 overflow-y-auto p-6 space-y-4"></div>

      <!-- メッセージ入力フォーム -->
      <div class="p-4 bg-gray-800 border-t border-gray-700">
        <form id="message-form" class="flex gap-2">
          <input type="text" id="message-input" placeholder="メッセージを送信..." class="flex-1 p-3 rounded-lg bg-gray-700 text-white border border-gray-600 focus:outline-none focus:border-indigo-500" disabled>
          <button type="submit" id="btn-send-message" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg font-bold disabled:opacity-50" disabled>送信</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 通話モーダル (ダイアログ) -->
  <div id="call-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center hidden z-50">
    <div class="bg-gray-900 p-6 rounded-xl max-w-lg w-full flex flex-col items-center">
      <h3 id="call-status-title" class="text-xl font-bold mb-4 text-center">通話中...</h3>
      
      <!-- 映像表示エリア -->
      <div class="relative w-full aspect-video bg-black rounded-lg overflow-hidden mb-6 flex items-center justify-center">
        <video id="remote-video" autoplay playsinline class="w-full h-full object-cover"></video>
        <video id="local-video" autoplay playsinline muted class="absolute bottom-3 right-3 w-32 aspect-video bg-gray-800 rounded border border-gray-600 object-cover"></video>
      </div>

      <!-- 通話操作ボタン -->
      <div id="active-call-controls" class="flex gap-4">
        <button id="btn-end-call" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full font-bold">切断</button>
      </div>
      <div id="incoming-call-controls" class="flex gap-4 hidden">
        <button id="btn-accept-call" class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-full font-bold">応答</button>
        <button id="btn-reject-call" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2 rounded-full font-bold">拒否</button>
      </div>
    </div>
  </div>

  <!-- アプリのメインJS処理 -->
  <script>
    // --- Supabase設定 ---
    const SUPABASE_URL = 'https://aaedzwnhwfhoyncunarl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZWR6d25od2Zob3luY3VuYXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTgwOTUsImV4cCI6MjEwNTQ3NDA5NX0.7trNhAI5OAJ0coOt4bNx-NAg5zhYvAWgG7QRoM6friI'; // 必要に応じてご自身のAnon Keyに変更してください
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // --- グローバル状態管理 ---
    let currentUser = null;
    let currentMode = 'dm'; // 'dm' または 'server'
    let currentTargetFriendId = null;
    let currentServerId = null;

    // WebRTC用変数
    let localStream = null;
    let peerConnection = null;
    let callChannel = null;
    let incomingSignalData = null;

    const rtcConfiguration = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // --- DOM要素 ---
    const authContainer = document.getElementById('auth-container');
    const appContainer = document.getElementById('app-container');
    const authError = document.getElementById('auth-error');
    const userDisplay = document.getElementById('user-display');
    const friendsList = document.getElementById('friends-list');
    const serversList = document.getElementById('servers-list');
    const messagesContainer = document.getElementById('messages-container');
    const messageInput = document.getElementById('message-input');
    const btnSendMessage = document.getElementById('btn-send-message');
    const chatTitle = document.getElementById('chat-title');
    const callButtons = document.getElementById('call-buttons');

    // --- 認証機能 ---
    document.getElementById('btn-signup').onclick = async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showError('ユーザー名とパスワードを入力してください');

      const { data, error } = await supabaseClient.from('users').insert([{ username, password }]).select().single();
      if (error) return showError('新規登録エラー: ' + error.message);

      currentUser = data;
      localStorage.setItem('discord_user', JSON.stringify(currentUser));
      initApp();
    };

    document.getElementById('btn-login').onclick = async () => {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      if (!username || !password) return showError('ユーザー名とパスワードを入力してください');

      const { data, error } = await supabaseClient.from('users').select('*').eq('username', username).eq('password', password).single();
      if (error || !data) return showError('ログイン失敗: ユーザー名かパスワードが違います');

      currentUser = data;
      localStorage.setItem('discord_user', JSON.stringify(currentUser));
      initApp();
    };

    document.getElementById('btn-logout').onclick = () => {
      localStorage.removeItem('discord_user');
      location.reload();
    };

    function showError(msg) {
      authError.textContent = msg;
      authError.classList.remove('hidden');
    }

    // --- アプリ初期化 ---
    function initApp() {
      authContainer.classList.add('hidden');
      appContainer.classList.remove('hidden');
      userDisplay.textContent = `${currentUser.username} (${currentUser.id.substring(0, 6)}...)`;

      loadFriends();
      setupRealtime();
    }

    // セッション自動復元
    const savedUser = localStorage.getItem('discord_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      initApp();
    }

    // --- タブ切り替え ---
    document.getElementById('tab-dm').onclick = () => {
      currentMode = 'dm';
      document.getElementById('tab-dm').className = 'flex-1 py-2 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500';
      document.getElementById('tab-server').className = 'flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent';
      document.getElementById('section-dm').classList.remove('hidden');
      document.getElementById('section-server').classList.add('hidden');
    };

    document.getElementById('tab-server').onclick = () => {
      currentMode = 'server';
      document.getElementById('tab-server').className = 'flex-1 py-2 text-sm font-semibold text-indigo-400 border-b-2 border-indigo-500';
      document.getElementById('tab-dm').className = 'flex-1 py-2 text-sm font-semibold text-gray-400 border-b-2 border-transparent';
      document.getElementById('section-server').classList.remove('hidden');
      document.getElementById('section-dm').classList.add('hidden');
      loadLocalServers();
    };

    // --- フレンド機能 ---
    document.getElementById('btn-add-friend').onclick = async () => {
      const friendName = document.getElementById('friend-username').value.trim();
      if (!friendName) return;

      const { data: targetUser, error } = await supabaseClient.from('users').select('*').eq('username', friendName).single();
      if (error || !targetUser) return alert('ユーザーが見つかりません');
      if (targetUser.id === currentUser.id) return alert('自分自身をフレンド追加することはできません');

      await supabaseClient.from('friends').insert([
        { user_id: currentUser.id, friend_id: targetUser.id },
        { user_id: targetUser.id, friend_id: currentUser.id }
      ]);

      document.getElementById('friend-username').value = '';
      loadFriends();
    };

    async function loadFriends() {
      const { data, error } = await supabaseClient.from('friends').select('friend_id, users!friends_friend_id_fkey(id, username)').eq('user_id', currentUser.id);
      friendsList.innerHTML = '';
      if (error || !data) return;

      data.forEach(item => {
        const friend = item.users;
        const div = document.createElement('div');
        div.className = 'p-2 rounded hover:bg-gray-800 cursor-pointer flex items-center justify-between text-sm';
        div.innerHTML = `<span>👤 ${friend.username}</span>`;
        div.onclick = () => selectFriend(friend);
        friendsList.appendChild(div);
      });
    }

    function selectFriend(friend) {
      currentTargetFriendId = friend.id;
      currentServerId = null;
      chatTitle.textContent = `DM: ${friend.username}`;
      callButtons.classList.remove('hidden');
      messageInput.disabled = false;
      btnSendMessage.disabled = false;
      console.log('✅ [選択] フレンドを選択しました。相手ID:', currentTargetFriendId);
      loadMessages();
    }

    // --- ローカルサーバー機能 ---
    document.getElementById('btn-create-server').onclick = () => {
      const serverName = document.getElementById('new-server-name').value.trim();
      if (!serverName) return;

      const servers = JSON.parse(localStorage.getItem('my_servers') || '[]');
      const newServer = { id: 'server_' + Date.now(), name: serverName };
      servers.push(newServer);
      localStorage.setItem('my_servers', JSON.stringify(servers));

      document.getElementById('new-server-name').value = '';
      loadLocalServers();
    };

    function loadLocalServers() {
      const servers = JSON.parse(localStorage.getItem('my_servers') || '[]');
      serversList.innerHTML = '';

      servers.forEach(srv => {
        const div = document.createElement('div');
        div.className = 'p-2 rounded hover:bg-gray-800 cursor-pointer flex items-center justify-between text-sm';
        div.innerHTML = `<span>🌐 ${srv.name}</span>`;
        div.onclick = () => selectServer(srv);
        serversList.appendChild(div);
      });
    }

    function selectServer(server) {
      currentServerId = server.id;
      currentTargetFriendId = null;
      chatTitle.textContent = `サーバー: ${server.name}`;
      callButtons.classList.add('hidden');
      messageInput.disabled = false;
      btnSendMessage.disabled = false;
      loadMessages();
    }

    // --- メッセージ機能 ---
    document.getElementById('message-form').onsubmit = async (e) => {
      e.preventDefault();
      const content = messageInput.value.trim();
      if (!content) return;

      if (currentMode === 'dm') {
        await supabaseClient.from('messages').insert([{
          sender_id: currentUser.id,
          receiver_id: currentTargetFriendId,
          content: content
        }]);
      } else {
        const localMsgs = JSON.parse(localStorage.getItem(`msgs_${currentServerId}`) || '[]');
        localMsgs.push({
          sender_name: currentUser.username,
          content: content,
          created_at: new Date().toLocaleTimeString()
        });
        localStorage.setItem(`msgs_${currentServerId}`, JSON.stringify(localMsgs));
      }

      messageInput.value = '';
      loadMessages();
    };

    async function loadMessages() {
      messagesContainer.innerHTML = '';

      if (currentMode === 'dm') {
        if (!currentTargetFriendId) return;
        const { data, error } = await supabaseClient.from('messages').select('*, users!messages_sender_id_fkey(username)')
          .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentTargetFriendId}),and(sender_id.eq.${currentTargetFriendId},receiver_id.eq.${currentUser.id})`)
          .order('created_at', { ascending: true });

        if (error || !data) return;

        data.forEach(msg => {
          renderMessage(msg.users ? msg.users.username : '不明', msg.content, new Date(msg.created_at).toLocaleTimeString());
        });
      } else {
        if (!currentServerId) return;
        const localMsgs = JSON.parse(localStorage.getItem(`msgs_${currentServerId}`) || '[]');
        localMsgs.forEach(msg => {
          renderMessage(msg.sender_name, msg.content, msg.created_at);
        });
      }

      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function renderMessage(sender, text, time) {
      const div = document.createElement('div');
      div.className = 'flex flex-col';
      div.innerHTML = `
        <div class="flex items-baseline gap-2">
          <span class="font-bold text-indigo-400 text-sm">${sender}</span>
          <span class="text-xs text-gray-500">${time}</span>
        </div>
        <div class="text-gray-200 mt-1 bg-gray-700/50 p-2.5 rounded-lg inline-block max-w-xl self-start">${text}</div>
      `;
      messagesContainer.appendChild(div);
    }

    // --- WebRTC ＆ Realtime (通話機能) ---

    // 通話ボタンのデバッグ用イベントリスナー
    document.getElementById('btn-start-audio-call').onclick = () => {
      console.log('📱 [通話ボタン] 音声通話がタップされました');
      startCall(false);
    };

    document.getElementById('btn-start-video-call').onclick = () => {
      console.log('📹 [通話ボタン] ビデオ通話がタップされました');
      startCall(true);
    };

    function setupRealtime() {
      // 1. DBメッセージ変更検知
      supabaseClient.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          console.log('⚡ [DB Realtime] メッセージを受信しました');
          if (currentMode === 'dm') loadMessages();
        })
        .subscribe((status) => {
          console.log('🔌 [DB Realtime ステータス]:', status);
        });

      // 2. 通話用 Broadcast シグナリング
      callChannel = supabaseClient.channel('call_signaling');

      callChannel
        .on('broadcast', { event: 'call-signal' }, async ({ payload }) => {
          console.log('📡 [シグナル受信]:', payload);

          // 自分宛ての通知でなければ無視
          if (payload.targetId !== currentUser.id) {
            console.log('⚠️ [シグナル] 自分のID宛ではないためスキップしました (targetId:', payload.targetId, ')');
            return;
          }

          if (payload.type === 'offer') {
            console.log('📞 [オファー着信] 呼び出し画面を表示します');
            incomingSignalData = payload;
            openCallModal(`${payload.senderName} から着信中...`, payload.isVideo);
            document.getElementById('active-call-controls').classList.add('hidden');
            document.getElementById('incoming-call-controls').classList.remove('hidden');
          } 
          else if (payload.type === 'answer') {
            console.log('✅ [アンサー受信] 通話が接続されました');
            document.getElementById('call-status-title').textContent = '通話中';
            if (peerConnection) {
              await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
            }
          } 
          else if (payload.type === 'candidate') {
            console.log('🧊 [ICE Candidate 受信]');
            if (peerConnection && payload.candidate) {
              await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
          } 
          else if (payload.type === 'end') {
            console.log('🛑 [通話終了通知を受信]');
            closeCall();
          }
        })
        .subscribe((status) => {
          console.log('🔌 [通話 Realtime ステータス]:', status);
        });
    }

    // 通話発信処理
    async function startCall(isVideo) {
      console.log('🚀 [startCall] 通話開始処理を起動します');
      console.log('  - 自分のID:', currentUser ? currentUser.id : '未ログイン');
      console.log('  - 相手のID:', currentTargetFriendId);

      if (!currentTargetFriendId) {
        console.error('❌ [通話エラー] 送信相手 (currentTargetFriendId) が選択されていません');
        alert('通話する相手が選択されていません。DMリストからフレンドを選択してください。');
        return;
      }

      openCallModal('呼び出し中...', isVideo);
      document.getElementById('active-call-controls').classList.add('hidden');
      document.getElementById('incoming-call-controls').classList.add('hidden');

      try {
        console.log('🎤 [メディア] マイク・カメラの許可を要求中...');
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
        document.getElementById('local-video').srcObject = localStream;
        console.log('✅ [メディア] マイク・カメラの取得成功');

        peerConnection = createPeerConnection(currentTargetFriendId);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        console.log('📡 [シグナル送信] オファーを送信しています...');
        const res = await callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'offer',
            senderId: currentUser.id,
            senderName: currentUser.username,
            targetId: currentTargetFriendId,
            sdp: offer,
            isVideo: isVideo
          }
        });
        console.log('📡 [シグナル送信結果]:', res);

        document.getElementById('active-call-controls').classList.remove('hidden');
      } catch (err) {
        console.error('❌ [通話例外エラー]:', err);
        alert('通話の開始に失敗しました: ' + err.message);
        closeCall();
      }
    }

    // 応答処理
    document.getElementById('btn-accept-call').onclick = async () => {
      if (!incomingSignalData) return;
      console.log('👍 [通話応答] 通話要求を承認しました');

      document.getElementById('incoming-call-controls').classList.add('hidden');
      document.getElementById('active-call-controls').classList.remove('hidden');
      document.getElementById('call-status-title').textContent = '接続中...';

      const isVideo = incomingSignalData.isVideo;
      const targetId = incomingSignalData.senderId;

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = createPeerConnection(targetId);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingSignalData.sdp));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        console.log('📡 [シグナル送信] アンサーを送信しています...');
        await callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: {
            type: 'answer',
            senderId: currentUser.id,
            targetId: targetId,
            sdp: answer
          }
        });

        document.getElementById('call-status-title').textContent = '通話中';
      } catch (err) {
        console.error('❌ [応答エラー]:', err);
        alert('通話の応答に失敗しました: ' + err.message);
        closeCall();
      }
    };

    // 拒否処理
    document.getElementById('btn-reject-call').onclick = () => {
      console.log('👎 [通話拒否]');
      if (incomingSignalData && callChannel) {
        callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { type: 'end', senderId: currentUser.id, targetId: incomingSignalData.senderId }
        });
      }
      closeCall();
    };

    // 切断ボタン
    document.getElementById('btn-end-call').onclick = () => {
      console.log('🛑 [通話切断] 通話を終了します');
      if (currentTargetFriendId && callChannel) {
        callChannel.send({
          type: 'broadcast',
          event: 'call-signal',
          payload: { type: 'end', senderId: currentUser.id, targetId: currentTargetFriendId }
        });
      }
      closeCall();
    };

    // PeerConnection作成ヘパー
    function createPeerConnection(targetId) {
      const pc = new RTCPeerConnection(rtcConfiguration);

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          console.log('🧊 [ICE Candidate 送信]');
          callChannel.send({
            type: 'broadcast',
            event: 'call-signal',
            payload: {
              type: 'candidate',
              senderId: currentUser.id,
              targetId: targetId,
              candidate: event.candidate
            }
          });
        }
      };

      pc.ontrack = (event) => {
        console.log('🎥 [リモート映像/音声を受信]');
        const remoteVideo = document.getElementById('remote-video');
        if (remoteVideo.srcObject !== event.streams[0]) {
          remoteVideo.srcObject = event.streams[0];
        }
      };

      pc.oniceconnectionstatechange = () => {
        console.log('🌐 [ICE 接続ステータス変更]:', pc.iceConnectionState);
      };

      return pc;
    }

    function openCallModal(statusText, isVideo) {
      document.getElementById('call-status-title').textContent = statusText;
      document.getElementById('call-modal').classList.remove('hidden');
    }

    function closeCall() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      document.getElementById('local-video').srcObject = null;
      document.getElementById('remote-video').srcObject = null;
      document.getElementById('call-modal').classList.add('hidden');
      incomingSignalData = null;
      console.log('🧹 [通話クリーンアップ完了]');
    }
  </script>
</body>
</html>
