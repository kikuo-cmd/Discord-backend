<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discord Clone with Supabase</title>
  <!-- Tailwind CSS, Lucide Icons, Supabase JS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #2f3136; }
    ::-webkit-scrollbar-thumb { background: #202225; border-radius: 3px; }
  </style>
</head>
<body class="bg-[#36393f] text-gray-200 select-none font-sans antialiased overflow-hidden">

  <div id="app" class="flex h-screen w-screen">
    <!-- 1. 認証画面 -->
    <div id="auth-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-[#2f3136]">
      <div class="bg-[#36393f] p-8 rounded-lg shadow-2xl w-96 border border-gray-700">
        <h1 class="text-2xl font-bold text-white mb-2 text-center" id="auth-title">アカウント作成</h1>
        
        <form id="auth-form" class="space-y-4 mt-4" onsubmit="return false;">
          <div>
            <label class="block text-xs font-bold text-gray-300 uppercase mb-1">アカウントID (@id)</label>
            <input type="text" id="auth-username" required placeholder="user_123" class="w-full p-2.5 rounded bg-[#202225] border border-gray-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
          </div>
          <div id="display-name-group">
            <label class="block text-xs font-bold text-gray-300 uppercase mb-1">表示名</label>
            <input type="text" id="auth-displayname" placeholder="表示名" class="w-full p-2.5 rounded bg-[#202225] border border-gray-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-300 uppercase mb-1">パスワード</label>
            <input type="password" id="auth-password" required placeholder="••••••••" class="w-full p-2.5 rounded bg-[#202225] border border-gray-700 text-white focus:outline-none focus:border-indigo-500 text-sm">
          </div>
          <button type="submit" id="auth-submit-btn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded transition text-sm">登録して始める</button>
        </form>

        <div class="mt-4 text-center">
          <button id="auth-toggle-btn" type="button" class="text-xs text-indigo-400 hover:underline">すでにアカウントをお持ちの方 (ログイン)</button>
        </div>
      </div>
    </div>

    <!-- 2. アプリメイン画面 -->
    <div id="main-screen" class="flex w-full h-full hidden">
      <!-- サーバーリストバー -->
      <div class="w-18 bg-[#202225] flex flex-col items-center py-3 space-y-2 z-20 flex-shrink-0">
        <button id="btn-dm-view" class="w-12 h-12 rounded-3xl bg-[#36393f] hover:bg-indigo-600 hover:rounded-2xl transition-all duration-200 flex items-center justify-center text-white">
          <i data-lucide="message-square" class="w-6 h-6"></i>
        </button>
      </div>

      <!-- サイドバー -->
      <div class="w-60 bg-[#2f3136] flex flex-col flex-shrink-0 border-r border-[#202225]/40">
        <div class="h-12 border-b border-[#202225] px-4 flex items-center font-bold text-white shadow-sm">
          <span>ダイレクトメッセージ</span>
        </div>
        <div id="sidebar-content" class="flex-1 overflow-y-auto p-2 space-y-0.5"></div>
        
        <!-- ログインユーザー情報 -->
        <div class="h-14 bg-[#292b2f] px-2 flex items-center justify-between">
          <div class="flex items-center space-x-2 overflow-hidden p-1">
            <div id="my-avatar" class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-sm text-white">U</div>
            <div class="truncate">
              <div id="my-display-name" class="text-sm font-bold text-white leading-tight truncate">User</div>
              <div id="my-username" class="text-xs text-gray-400 leading-tight truncate">@id</div>
            </div>
          </div>
          <div class="flex items-center space-x-1">
            <!-- ログアウトボタン -->
            <button id="btn-logout" type="button" title="ログアウト" class="p-1.5 text-gray-400 hover:text-yellow-400 rounded hover:bg-gray-700/50">
              <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
            <!-- アカウント削除ボタン -->
            <button id="btn-delete-account" type="button" title="アカウント削除" class="p-1.5 text-gray-400 hover:text-red-500 rounded hover:bg-gray-700/50">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- メインエリア -->
      <div class="flex-1 flex flex-col bg-[#36393f] relative overflow-hidden">
        <div class="h-12 border-b border-[#202225] px-4 flex items-center justify-between shadow-sm">
          <div class="flex items-center space-x-2 text-white font-bold" id="header-title-container">
            <i data-lucide="users" class="w-5 h-5 text-gray-400"></i>
            <span id="header-title">フレンド一覧</span>
          </div>
        </div>

        <div class="flex-1 flex overflow-hidden">
          <!-- フレンドビュー -->
          <div id="friends-view" class="flex-1 flex flex-col p-6 overflow-y-auto">
            <div class="bg-[#2f3136] p-4 rounded-lg mb-6 border border-gray-700">
              <h3 class="text-sm font-bold text-white mb-1">フレンドに追加</h3>
              <p class="text-xs text-gray-400 mb-3">Supabase上のリアルなアカウントID (@id) を検索して追加します</p>
              <form id="add-friend-form" class="flex gap-2" onsubmit="return false;">
                <input type="text" id="friend-id-input" placeholder="アカウントIDを入力..." class="flex-1 bg-[#202225] border border-gray-700 rounded p-2 text-sm text-white focus:outline-none focus:border-indigo-500">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded text-sm font-medium">申請送信</button>
              </form>
            </div>
            <h3 class="text-xs font-bold text-gray-400 uppercase mb-2">フレンドリスト</h3>
            <div id="friends-list" class="space-y-1"></div>
          </div>

          <!-- チャットビュー -->
          <div id="chat-view" class="flex-1 flex flex-col hidden h-full">
            <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="p-4 bg-[#36393f]">
              <form id="chat-form" class="bg-[#40444b] rounded-lg flex items-center px-4 py-2.5" onsubmit="return false;">
                <input type="text" id="chat-input" placeholder="メッセージを入力..." class="flex-1 bg-transparent text-white focus:outline-none text-sm">
                <button type="submit" class="text-indigo-400 hover:text-indigo-300 ml-2">
                  <i data-lucide="send" class="w-5 h-5"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // Supabase 設定
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://aaedzwnhwfhoyncunarl.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFhZWR6d25od2Zob3luY3VuYXJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTgwOTUsImV4cCI6MjEwNTQ3NDA5NX0.7trNhAI5OAJ0coOt4bNx-NAg5zhYvAWgG7QRoM6friI';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // -------------------------------------------------------------
    // ローカルストレージ管理
    // -------------------------------------------------------------
    const SESSION_KEY = 'my_discord_session';
    let currentUser = JSON.parse(localStorage.getItem(SESSION_KEY)) || null;
    let currentTargetFriendId = null;
    let isSignUpMode = true;

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initAuth();
      if (currentUser) {
        showMainApp();
      }
    });

    // -------------------------------------------------------------
    // 1. 認証 (新規登録・ログイン・アカウント削除)
    // -------------------------------------------------------------
    function initAuth() {
      const authForm = document.getElementById('auth-form');
      const toggleBtn = document.getElementById('auth-toggle-btn');
      const displayNameGroup = document.getElementById('display-name-group');
      const submitBtn = document.getElementById('auth-submit-btn');

      toggleBtn.addEventListener('click', (e) => {
        e.preventDefault();
        isSignUpMode = !isSignUpMode;
        displayNameGroup.style.display = isSignUpMode ? 'block' : 'none';
        submitBtn.textContent = isSignUpMode ? '登録して始める' : 'ログイン';
        document.getElementById('auth-title').textContent = isSignUpMode ? 'アカウント作成' : 'おかえりなさい！';
      });

      authForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value;
        const displayName = document.getElementById('auth-displayname').value.trim() || username;

        if (!username || !password) {
          alert('アカウントIDとパスワードを入力してください。');
          return;
        }

        try {
          if (isSignUpMode) {
            // 新規アカウント作成
            const { data, error } = await supabaseClient
              .from('profiles')
              .insert({ user_id_name: username, display_name: displayName, password })
              .select()
              .single();

            if (error) {
              alert('登録エラー: ' + error.message);
              return;
            }
            currentUser = data;
          } else {
            // ログイン認証
            const { data, error } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('user_id_name', username)
              .eq('password', password)
              .single();

            if (error || !data) {
              alert('アカウントIDまたはパスワードが正しくありません');
              return;
            }
            currentUser = data;
          }

          localStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
          showMainApp();
        } catch (err) {
          alert('エラーが発生しました: ' + err.message);
        }
      });

      // ログアウト処理
      document.getElementById('btn-logout').addEventListener('click', () => {
        localStorage.removeItem(SESSION_KEY);
        location.reload();
      });

      // アカウント削除処理
      document.getElementById('btn-delete-account').addEventListener('click', async () => {
        const confirmDelete = confirm(`本当にアカウント (@${currentUser.user_id_name}) を削除しますか？\nこの操作は取り消せません。`);
        if (!confirmDelete) return;

        try {
          // 1. メッセージデータの削除
          await supabaseClient
            .from('messages')
            .delete()
            .or(`sender_id.eq.${currentUser.id},target_id.eq.${currentUser.id}`);

          // 2. フレンド関係の削除
          await supabaseClient
            .from('friendships')
            .delete()
            .or(`from_id.eq.${currentUser.id},to_id.eq.${currentUser.id}`);

          // 3. プロフィール本体の削除
          const { error } = await supabaseClient
            .from('profiles')
            .delete()
            .eq('id', currentUser.id);

          if (error) {
            alert('アカウント削除に失敗しました: ' + error.message);
            return;
          }

          alert('アカウントを完全に削除しました。');
          localStorage.removeItem(SESSION_KEY);
          location.reload();
        } catch (err) {
          alert('削除中にエラーが発生しました: ' + err.message);
        }
      });
    }

    // -------------------------------------------------------------
    // 2. メインアプリ起動
    // -------------------------------------------------------------
    async function showMainApp() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('main-screen').classList.remove('hidden');

      document.getElementById('my-display-name').textContent = currentUser.display_name;
      document.getElementById('my-username').textContent = '@' + currentUser.user_id_name;
      document.getElementById('my-avatar').textContent = currentUser.display_name.charAt(0).toUpperCase();

      await renderSidebar();
      renderMainArea();
      setupRealtime();
    }

    // -------------------------------------------------------------
    // 3. Supabaseからフレンドデータの読み込み
    // -------------------------------------------------------------
    async function loadFriendsFromSupabase() {
      const { data, error } = await supabaseClient
        .from('friendships')
        .select(`
          from_id, to_id,
          from_user:from_id(*),
          to_user:to_id(*)
        `)
        .or(`from_id.eq.${currentUser.id},to_id.eq.${currentUser.id}`);

      if (error) return [];

      return data.map(f => f.from_id === currentUser.id ? f.to_user : f.from_user).filter(Boolean);
    }

    async function renderSidebar() {
      const content = document.getElementById('sidebar-content');
      content.innerHTML = '';

      const friendsBtn = document.createElement('div');
      friendsBtn.className = `flex items-center space-x-3 p-2 rounded cursor-pointer hover:bg-gray-700/50 ${currentTargetFriendId === null ? 'bg-gray-700/60 text-white' : 'text-gray-300'}`;
      friendsBtn.innerHTML = `<i data-lucide="users" class="w-5 h-5"></i><span class="font-medium text-sm">フレンド</span>`;
      friendsBtn.onclick = () => { currentTargetFriendId = null; renderSidebar(); renderMainArea(); };
      content.appendChild(friendsBtn);

      const friends = await loadFriendsFromSupabase();
      if (friends.length > 0) {
        const label = document.createElement('div');
        label.className = 'text-xs font-bold text-gray-400 uppercase px-2 pt-4 pb-1';
        label.textContent = 'ダイレクトメッセージ';
        content.appendChild(label);

        friends.forEach(friend => {
          const item = document.createElement('div');
          item.className = `flex items-center space-x-2 p-2 rounded cursor-pointer hover:bg-gray-700/50 ${currentTargetFriendId === friend.id ? 'bg-gray-700/60 text-white' : 'text-gray-300'}`;
          item.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-xs text-white">${friend.display_name.charAt(0)}</div>
            <div class="truncate text-sm font-medium">${friend.display_name}</div>
          `;
          item.onclick = () => { currentTargetFriendId = friend.id; renderSidebar(); renderMainArea(); };
          content.appendChild(item);
        });
      }
      lucide.createIcons();
    }

    // フレンド申請処理
    document.getElementById('add-friend-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('friend-id-input');
      const targetUsername = input.value.trim();

      if (!targetUsername) return;
      if (targetUsername === currentUser.user_id_name) return alert('自分自身は追加できません');

      const { data: targetUser, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .eq('user_id_name', targetUsername)
        .single();

      if (error || !targetUser) return alert('指定されたアカウントIDは見つかりません');

      await supabaseClient.from('friendships').insert({ from_id: currentUser.id, to_id: targetUser.id });
      alert(`${targetUser.display_name} さんとフレンドになりました！`);
      input.value = '';
      renderSidebar();
      renderMainArea();
    });

    // -------------------------------------------------------------
    // 4. メッセージ処理 & リアルタイム同期
    // -------------------------------------------------------------
    async function renderMainArea() {
      const friendsView = document.getElementById('friends-view');
      const chatView = document.getElementById('chat-view');

      if (currentTargetFriendId === null) {
        friendsView.classList.remove('hidden');
        chatView.classList.add('hidden');
        renderFriendsList();
      } else {
        friendsView.classList.add('hidden');
        chatView.classList.remove('hidden');
        await loadMessagesFromSupabase();
      }
    }

    async function renderFriendsList() {
      const container = document.getElementById('friends-list');
      container.innerHTML = '';
      const friends = await loadFriendsFromSupabase();

      if (friends.length === 0) {
        container.innerHTML = `<div class="text-xs text-gray-500 py-4">まだフレンドがいません</div>`;
        return;
      }

      friends.forEach(f => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between p-2 rounded hover:bg-gray-700/40 border-t border-gray-700/30';
        item.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white">${f.display_name.charAt(0)}</div>
            <div>
              <div class="text-sm font-bold text-white">${f.display_name}</div>
              <div class="text-xs text-gray-400">@${f.user_id_name}</div>
            </div>
          </div>
          <button class="p-2 bg-[#2f3136] hover:bg-gray-600 rounded-full text-gray-200 btn-msg" type="button">
            <i data-lucide="message-square" class="w-4 h-4"></i>
          </button>
        `;
        item.querySelector('.btn-msg').onclick = () => { currentTargetFriendId = f.id; renderSidebar(); renderMainArea(); };
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    async function loadMessagesFromSupabase() {
      const container = document.getElementById('message-container');
      container.innerHTML = '';

      const { data: messages } = await supabaseClient
        .from('messages')
        .select('*, sender:sender_id(*)')
        .or(`and(sender_id.eq.${currentUser.id},target_id.eq.${currentTargetFriendId}),and(sender_id.eq.${currentTargetFriendId},target_id.eq.${currentUser.id})`)
        .order('created_at', { ascending: true });

      (messages || []).forEach(msg => {
        if (!msg.sender) return;
        const msgEl = document.createElement('div');
        msgEl.className = 'flex items-start space-x-3 p-1 rounded';
        msgEl.innerHTML = `
          <div class="w-8 h-8 rounded-full bg-indigo-500 flex items-center justify-center font-bold text-white flex-shrink-0">${msg.sender.display_name.charAt(0)}</div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-bold text-sm text-white">${msg.sender.display_name}</span>
              <span class="text-[10px] text-gray-400">${new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
            </div>
            <div class="text-sm text-gray-200">${msg.content}</div>
          </div>
        `;
        container.appendChild(msgEl);
      });
      container.scrollTop = container.scrollHeight;
    }

    document.getElementById('chat-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text || !currentTargetFriendId) return;

      await supabaseClient.from('messages').insert({
        sender_id: currentUser.id,
        target_id: currentTargetFriendId,
        content: text
      });

      input.value = '';
      loadMessagesFromSupabase();
    });

    function setupRealtime() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          if (currentTargetFriendId && (payload.new.sender_id === currentTargetFriendId || payload.new.target_id === currentTargetFriendId)) {
            loadMessagesFromSupabase();
          }
        })
        .subscribe();
    }
  </script>
</body>
</html>
